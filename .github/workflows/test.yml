name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake

      - name: Configure
        # LibOBClient is optional here: tpcc_tests does not link Connector/C.
        # Full binary / OB integration tests require docs/LIBOBCLIENT.md.
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build and run unit tests
        run: |
          cmake --build build --target tpcc_tests -j"$(nproc)"
          ./build/tpcc_tests

  # TODO: job that builds LibOBClient and runs tpcc_ob_tests / smoke against OceanBase CE.
